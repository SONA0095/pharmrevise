<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmReVise - Drug Database</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            transition: background 0.3s, color 0.3s;
        }
        .dark-mode {
            background: #121212;
            color: white;
        }
        .light-mode {
            background: #f4f4f4;
            color: black;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: #007bff;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
        }
        table {
            width: 90%;
            margin: 20px auto;
            border-collapse: collapse;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            overflow: hidden;
        }
        th, td {
            padding: 15px;
            border: 1px solid #ddd;
            text-align: left;
        }
        th {
            background: #007bff;
            color: white;
            font-size: 1.2rem;
        }
        button {
            padding: 10px 15px;
            cursor: pointer;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            transition: 0.3s;
        }
        button:hover {
            background: #0056b3;
            color: white;
        }
        .animate-fade {
            animation: fadeIn 0.8s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="light-mode">
    <header>
        <h1>PharmReVise</h1>
        <button id="theme-toggle">Toggle Dark/Light Mode</button>
    </header>
    
    <main>
        <table id="drug-table" class="animate-fade">
            <thead>
                <tr>
                    <th>Drug Name</th>
                    <th>Current Indication</th>
                    <th>Possible Repurposed Use</th>
                    <th>Repurposing Score (%)</th>
                    <th>Molecular Formula</th>
                    <th>Mechanism of Action</th>
                    <th>Side Effects</th>
                    <th>Approval Year</th>
                </tr>
            </thead>
            <tbody>
                <!-- Data will be inserted here dynamically -->
            </tbody>
        </table>
    </main>

    <script>
        document.getElementById('theme-toggle').addEventListener('click', function() {
            document.body.classList.toggle('dark-mode');
            document.body.classList.toggle('light-mode');
        });
    </script>
</body>
</html>
